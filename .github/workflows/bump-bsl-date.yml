name: Bump BSL Change Date

on:
  schedule:
    - cron: '0 2 1 5,11 *'  # Twice a year (May 1 and November 1 at 02:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Bump even if no code changes occurred since last LICENSE update'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Preview changes without committing or pushing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bump-change-date:
    name: Bump BSL 1.1 Change Date
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump BSL Change Date
        id: bump
        env:
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/bump_bsl_change_date.py "${ARGS[@]}"

      - name: Commit and push updated Change Date
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE README.md
          git commit -m "Chore: Bump BSL change date to ${{ steps.bump.outputs.target_date }}"
          git push origin HEAD:main
