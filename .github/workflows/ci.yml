name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DJANGO_ENV: testing
  DJANGO_SETTINGS_MODULE: GiftManager.settings

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-env: "py310,lint"
          - python-version: "3.11"
            tox-env: "py311"
          - python-version: "3.12"
            tox-env: "py312"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gift_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.7
          uv sync --frozen --extra test

      - name: Run migrations
        run: uv run --frozen python manage.py migrate --no-input
        env:
          DB_NAME: gift_manager_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Run tox checks
        run: uv run --frozen tox run -e ${{ matrix.tox-env }}
        env:
          DB_NAME: gift_manager_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./reports/coverage-py312.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            reports/pytest-py*.xml
            reports/pytest-py*.html
            reports/coverage-py*.xml
            reports/coverage-py*/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.10.7
          uv sync --frozen --extra test

      - name: Run Bandit security linter
        run: >
          uv run --frozen bandit -r gift_manager -x gift_manager/tests
          --severity-level high --confidence-level high -f json -o bandit-report.json

      - name: Run pip-audit
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --format requirements.txt --output-file /tmp/gift-manager-requirements.txt
          uv run --frozen pip-audit --requirement /tmp/gift-manager-requirements.txt --no-deps --disable-pip --output pip-audit-report.json --format json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build uv==0.10.7 wheel
          uv sync --frozen --extra test

      - name: Check migrations are committed
        run: uv run --frozen python manage.py makemigrations --check --dry-run

      - name: Check production settings
        run: uv run --frozen python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: "opmn+^k8y5sqp^1*ni2irm8#rr2htl$6#=6f_al-q%8miorik5"
          EMAIL_ENCRYPTION_KEY: uqevclFMYjSZMFLOrZFDGwiIjQHKTUKDb7S6uFRumpQ=
          DB_NAME: gift_manager
          DB_USER: gift_manager
          DB_PASSWORD: gift_manager_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://:redis_password_for_ci@localhost:6379/0
          ALLOWED_HOSTS: gift.example.com,www.gift.example.com
          CSRF_TRUSTED_ORIGINS: https://gift.example.com,https://www.gift.example.com
          EMAIL_HOST: smtp.example.com
          DEFAULT_FROM_EMAIL: noreply@example.com

      - name: Validate production Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          DJANGO_SECRET_KEY: "opmn+^k8y5sqp^1*ni2irm8#rr2htl$6#=6f_al-q%8miorik5"
          EMAIL_ENCRYPTION_KEY: uqevclFMYjSZMFLOrZFDGwiIjQHKTUKDb7S6uFRumpQ=
          DB_NAME: gift_manager
          DB_USER: gift_manager
          DB_PASSWORD: gift_manager_password
          REDIS_PASSWORD: redis_password_for_ci
          ALLOWED_HOSTS: gift.example.com,www.gift.example.com
          CSRF_TRUSTED_ORIGINS: https://gift.example.com,https://www.gift.example.com
          EMAIL_HOST: smtp.example.com
          DEFAULT_FROM_EMAIL: noreply@example.com
          NGINX_SERVER_NAME: gift.example.com www.gift.example.com
          NGINX_CANONICAL_HOST: gift.example.com
          NGINX_SSL_DIR: ./certs

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
