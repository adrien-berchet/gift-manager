# Docker Compose configuration for Gift Manager
# Usage:
#   Development: docker compose up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: gift-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gift_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gift_manager_secret}
      POSTGRES_DB: ${DB_NAME:-gift_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gift_manager} -d ${DB_NAME:-gift_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Redis Cache (optional)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: gift-manager-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Django Application (Development)
  # =============================================================================
  web:
    build:
      context: .
      target: development
    container_name: gift-manager-web
    restart: unless-stopped
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      - DB_NAME=${DB_NAME:-gift_manager}
      - DB_USER=${DB_USER:-gift_manager}
      - DB_PASSWORD=${DB_PASSWORD:-gift_manager_secret}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
      - "5678:5678"  # Debug port
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: gift-manager-network
