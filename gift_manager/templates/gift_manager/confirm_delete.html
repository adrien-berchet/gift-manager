{% extends "gift_manager/base.html" %}

{% load i18n %}
{% block title %}{% trans "Confirm Deletion" %}{% endblock %}

{% block content %}
<h1 class="my-4">{% trans "Confirm Deletion" %}</h1>
<p>{% trans "Are you sure you want to delete this item?" %}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
    <a href="{{ cancel_url }}" class="btn btn-secondary">{% trans "Cancel" %}</a>
</form>
{% endblock %}
