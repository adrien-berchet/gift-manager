{% extends "gift_manager/base.html" %}

{% block title %}Create {{ type }}{% endblock %}

{% block content %}
<h1 class="my-4">Create {{ type }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'gift_manager:home' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
