{% extends "gift_manager/base.html" %}

{% load i18n %}
{% block title %}{% trans "Add Relation" %}{% endblock %}

{% block content %}
<h1 class="my-4">{% trans "Add Relation for" %} {{ gift.name }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">{% trans "Save" %}</button>
    <a href="{% url 'gift_manager:gift_detail' gift.gift_id %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
</form>
{% endblock %}
