{% extends "gift_manager/base.html" %}

{% block title %}Add Relation{% endblock %}

{% block content %}
<h1 class="my-4">Add Relation for {{ person.first_name }} {{ person.family_name }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'gift_manager:person_detail' person.person_id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
