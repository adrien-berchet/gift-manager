{% load i18n %}
{% load fallback_tags %}

<div class="fallback-actions">
    {% if object.get_absolute_url %}
        <a href="{{ object.get_absolute_url }}" class="btn btn-sm btn-outline-primary">
            <i class="fas fa-eye me-1"></i>{% trans "View" %}
        </a>
    {% endif %}

    {% if perms.gift_manager.change %}
        <a href="{% fallback_url 'gift_manager:'|add:object_type|lower|add:'_edit' object.pk %}"
           class="btn btn-sm btn-outline-warning">
            <i class="fas fa-edit me-1"></i>{% trans "Edit" %}
        </a>
    {% endif %}

    {% if perms.gift_manager.delete %}
        <a href="{% fallback_url 'gift_manager:'|add:object_type|lower|add:'_delete' object.pk %}"
           class="btn btn-sm btn-outline-danger"
           onclick="return confirm('{% trans "Are you sure you want to delete this item?" %}')">
            <i class="fas fa-trash me-1"></i>{% trans "Delete" %}
        </a>
    {% endif %}
</div>
