{% extends "gift_manager/base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Gift Manager - {% trans "Home" %}{% endblock %}

{% block content %}

<div class="row">
    <div class="col-md-8">
        <div class="jumbotron">
            <div class="row">
                <div class="col-sm-8">
                    <h1>{% trans "Welcome to Gift Manager" %}</h1>
                </div>
                <div class="col-sm-4">
                    <img src="{% static 'gift_manager/images/gift.png' %}" alt="Gift Image" class="img-fluid"/>
                </div>
            </div>
            <div class="row">
                <p>{% trans "This web site will help you to manage all your gifts!" %}</p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
