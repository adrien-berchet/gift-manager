{% load i18n %}
{# Collapsible Filter Panel Component - pass grid_id variable when including #}

<div class="grid-filter-panel" id="{{ grid_id }}-filter-panel">
    <button type="button"
            class="filter-toggle-btn"
            id="{{ grid_id }}-filter-toggle"
            aria-expanded="false"
            aria-controls="{{ grid_id }}-filter-content">
        <i class="fas fa-sliders-h" aria-hidden="true"></i>
        <span>{% trans "Filters & Sort" %}</span>
        <i class="fas fa-chevron-down ms-auto" aria-hidden="true"></i>
    </button>
    <div class="filter-content" id="{{ grid_id }}-filter-content">
        {# Sort section #}
        <div class="filter-section sort-section">
            <div class="sort-section-header">
                <span class="filter-section-label" id="{{ grid_id }}-sort-label">{% trans "Sort by" %}</span>
                <button type="button" class="multi-sort-toggle" id="{{ grid_id }}-multi-sort-toggle"
                        title="{% trans 'Enable multi-column sorting' %}"
                        aria-pressed="false"
                        aria-controls="{{ grid_id }}-sort-options">
                    <i class="fas fa-layer-group" aria-hidden="true"></i>
                    <span>{% trans "Multi" %}</span>
                </button>
            </div>
            <div class="sort-options" id="{{ grid_id }}-sort-options" role="group" aria-labelledby="{{ grid_id }}-sort-label">
                {# Sort options will be dynamically generated by JavaScript #}
            </div>
        </div>
        {# View toggle section #}
        <div class="filter-section view-section">
            <span class="filter-section-label" id="{{ grid_id }}-view-label">{% trans "View" %}</span>
            <div class="view-toggle-options" id="{{ grid_id }}-view-options" role="group" aria-labelledby="{{ grid_id }}-view-label">
                <button type="button" class="view-option active" data-view="list" title="{% trans 'List view' %}" aria-pressed="true">
                    <i class="fas fa-list" aria-hidden="true"></i>
                </button>
                <button type="button" class="view-option" data-view="card" title="{% trans 'Card view' %}" aria-pressed="false">
                    <i class="fas fa-th-large" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
