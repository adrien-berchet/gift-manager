{% load i18n %}
{# Collapsible Filter Panel Component - pass grid_id variable when including #}

<div class="grid-filter-panel" id="{{ grid_id }}-filter-panel">
    <button type="button" class="filter-toggle-btn" id="{{ grid_id }}-filter-toggle">
        <i class="fas fa-sliders-h"></i>
        <span>{% trans "Filters & Sort" %}</span>
        <i class="fas fa-chevron-down ms-auto"></i>
    </button>
    <div class="filter-content" id="{{ grid_id }}-filter-content">
        {# Search section #}
        <div class="filter-section search-section">
            <label class="filter-section-label">{% trans "Search" %}</label>
            <input type="text" class="form-control filter-search-input" id="{{ grid_id }}-search"
                   placeholder="{% trans 'Search...' %}">
        </div>
        {# Sort section #}
        <div class="filter-section sort-section">
            <label class="filter-section-label">{% trans "Sort by" %}</label>
            <div class="sort-options" id="{{ grid_id }}-sort-options">
                {# Sort options will be dynamically generated by JavaScript #}
            </div>
        </div>
        {# View toggle section #}
        <div class="filter-section view-section">
            <label class="filter-section-label">{% trans "View" %}</label>
            <div class="view-toggle-options" id="{{ grid_id }}-view-options">
                <button type="button" class="view-option active" data-view="list" title="{% trans 'List view' %}">
                    <i class="fas fa-list"></i>
                </button>
                <button type="button" class="view-option" data-view="card" title="{% trans 'Card view' %}">
                    <i class="fas fa-th-large"></i>
                </button>
            </div>
        </div>
    </div>
</div>
