{% load i18n %}

<div class="{% if form_surface == 'page' %}page-form-actions{% else %}panel-form-actions{% endif %}">
  {% if delete_url %}
  <a href="{{ delete_url }}"
     class="btn btn-outline-danger form-delete-action"
     data-action="delete">
    <i class="fas fa-trash me-1" aria-hidden="true"></i>
    {% trans "Delete" %}
  </a>
  {% endif %}

  {% if form_surface == "page" %}
  <a href="{{ cancel_url }}" class="btn btn-secondary">
    <i class="fas fa-times me-1" aria-hidden="true"></i>
    {% trans "Cancel" %}
  </a>
  {% else %}
  <button type="button"
          class="btn btn-secondary"
          data-bs-dismiss="offcanvas"
          aria-label="{% trans 'Cancel' %}">
    <i class="fas fa-times me-1" aria-hidden="true"></i>
    {% trans "Cancel" %}
  </button>
  {% endif %}

  <button type="submit"
          class="btn btn-primary"
          data-loading-text="{% trans 'Saving...' %}"
          aria-label="{% trans 'Save changes' %}">
    <i class="fas fa-save me-1" aria-hidden="true"></i>
    {% trans "Save" %}
  </button>
</div>
