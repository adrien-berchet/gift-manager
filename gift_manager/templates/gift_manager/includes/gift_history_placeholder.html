{% load i18n %}
{% comment %} Lazy-loaded gift history section. Required context: history_url. {% endcomment %}
<div class="detail-section mt-4 mb-4" data-gift-history-section>
    <h6 class="detail-section-title text-muted mb-3">
        <i class="fas fa-clock-rotate-left me-2" aria-hidden="true"></i>{% trans "Gift history" %}
    </h6>
    <div hx-get="{{ history_url }}"
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-indicator="none">
        <p class="text-muted small mb-0">{% trans "Loading…" %}</p>
    </div>
</div>
