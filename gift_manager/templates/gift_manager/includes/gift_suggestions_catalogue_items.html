{% load i18n %}
<div class="gift-suggestions-catalogue-items">
    {% for candidate in candidates %}
        {% include "gift_manager/includes/gift_suggestion_item.html" with candidate=candidate %}
    {% empty %}
        <p class="text-muted small mb-0">{% trans "No matching gifts in your catalogue." %}</p>
    {% endfor %}
    {% if next_offset is not None %}
        <div class="mt-2 text-center">
            <button type="button"
                    class="btn btn-sm btn-outline-secondary suggestion-show-more-btn"
                    data-suggestion-show-more
                    data-no-button-loading
                    hx-get="{{ suggestions_url }}?offset={{ next_offset }}{% if surface %}&surface={{ surface }}{% endif %}"
                    hx-target="closest div"
                    hx-swap="outerHTML"
                    hx-disabled-elt="this">
                <span class="show-more-idle">{% trans "Show more" %}</span>
                <span class="show-more-loading" role="status">
                    <i class="fas fa-spinner fa-spin me-1" aria-hidden="true"></i>{% trans "Loading…" %}
                </span>
            </button>
        </div>
    {% endif %}
</div>
