{% load i18n %}
{# Reusable action buttons for person groups - used in both grid and tree views #}
{# Parameters: group_id, stop_propagation (optional, default false) #}
<a href="{% url 'gift_manager:person_group_relation_create' group_id %}"
   class="btn btn-sm btn-success"
   title="{% trans 'Give' %}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-gift"></i>
</a>
<a href="{% url 'gift_manager:person_group_detail' group_id %}"
   class="btn btn-sm btn-info"
   title="{% trans 'Details' %}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-info-circle"></i>
</a>
<a href="{% url 'gift_manager:person_group_edit' group_id %}"
   class="btn btn-sm btn-warning"
   title="{% trans 'Edit' %}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-edit"></i>
</a>
<a href="{% url 'gift_manager:person_group_delete' group_id %}"
   class="btn btn-sm btn-danger"
   title="{% trans 'Delete' %}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-trash"></i>
</a>
