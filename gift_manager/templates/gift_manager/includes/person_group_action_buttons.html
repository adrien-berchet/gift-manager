{% load i18n %}
{# Reusable action buttons for person groups - used in both grid and tree views #}
{# Parameters: group_id, stop_propagation (optional, default false) #}
<a href="{% url 'gift_manager:person_group_relation_create' group_id %}"
   class="btn btn-primary btn-sm quick-action-btn"
   title="{% trans 'Give' %}"
   data-action="create"
   data-entity-id="{{ group_id }}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-hand-holding-heart"></i>
</a>
<a href="{% url 'gift_manager:person_group_detail' group_id %}"
   class="btn btn-info btn-sm quick-action-btn"
   title="{% trans 'Details' %}"
   data-action="detail"
   data-entity-id="{{ group_id }}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-eye"></i>
</a>
<a href="{% url 'gift_manager:person_group_edit' group_id %}"
   class="btn btn-warning btn-sm quick-action-btn"
   title="{% trans 'Edit' %}"
   data-action="edit"
   data-entity-id="{{ group_id }}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-edit"></i>
</a>
<a href="{% url 'gift_manager:person_group_delete' group_id %}"
   class="btn btn-danger btn-sm quick-action-btn"
   title="{% trans 'Delete' %}"
   data-action="delete"
   data-entity-id="{{ group_id }}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-trash"></i>
</a>
<a href="{% url 'gift_manager:share_objects' %}"
   class="btn btn-success btn-sm quick-action-btn"
   title="{% trans 'Share' %}"
   data-action="share"
   data-entity-id="{{ group_id }}"
   {% if stop_propagation %}onclick="event.stopPropagation();"{% endif %}>
    <i class="fas fa-share-alt"></i>
</a>
