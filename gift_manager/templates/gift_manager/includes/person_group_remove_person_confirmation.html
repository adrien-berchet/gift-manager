{% load i18n %}
<div class="d-flex align-items-start mb-3">
  <div class="text-danger me-3 flex-shrink-0">
    <i class="fas fa-user-minus fa-2x" aria-hidden="true"></i>
  </div>
  <div class="flex-grow-1">
    <h6 class="mb-2 fw-semibold">
      {% blocktrans with person=person group=group.name %}Remove {{ person }} from the group {{ group }}?{% endblocktrans %}
    </h6>
    <p class="text-muted mb-0 small">
      {% trans "The person is not deleted: only their membership in this group is removed." %}
    </p>
  </div>
</div>

<form id="deleteForm" method="post" action="{{ remove_url }}">
  {% csrf_token %}
</form>
