{% load i18n %}
{{ grid_data|json_script:"grid-data" }}
{{ user_permissions|json_script:"user-permissions" }}

<script>
    (function () {
        const permEl = document.getElementById('user-permissions');
        window.userPermissions = permEl ? JSON.parse(permEl.textContent) : {};
        const userPermissions = window.userPermissions;

        const dataEl = document.getElementById('grid-data');
        const data = dataEl ? JSON.parse(dataEl.textContent) : [];

    const columns = [
        GridUtils.createCheckboxColumn(5),
        {
            id: 'first_name',
            name: '{{ column_names.first_name|escapejs }}',
            attributes: { 'data-card-role': 'title', 'data-card-icon': 'person' },
            sort: {
                compare: GridUtils.sortString()
            },
            formatter: (cell) => {
                return gridjs.html(
                    `<span class="entity-name">${GridUtils.escapeHtml(cell)}</span>`
                );
            }
        },
        {
            id: 'family_name',
            name: '{{ column_names.family_name|escapejs }}',
            attributes: { 'data-card-icon': 'family-name' },
            sort: {
                compare: GridUtils.sortString()
            }
        },
        {
            id: 'email',
            name: '{{ column_names.email_address|escapejs }}',
            attributes: { 'data-card-icon': 'email' }
        },
        {
            id: 'groups',
            name: '{{ column_names.groups|escapejs }}',
            attributes: { 'data-card-icon': 'group' },
            formatter: GridUtils.multiLinkFormatter()
        },
        { name: 'person_id', hidden: true },
        { name: 'person_relation_create_url', hidden: true },
        { name: 'person_detail_url', hidden: true },
        { name: 'person_edit_url', hidden: true },
        { name: 'person_delete_url', hidden: true },
        {
            id: 'actions',
            name: '{% trans "Actions"|escapejs %}',
            width: '360px',
            sort: false,
            formatter: PermissionUtils.permissionAwareActionFormatter({
                give: (row) => row.cells[6].data,
                details: (row) => row.cells[7].data,
                edit: (row) => row.cells[8].data,
                delete: (row) => row.cells[9].data,
                share: () => "{% url 'gift_manager:share_objects' %}"
            }, ['give', 'details', 'edit', 'delete', 'share'], {
                idResolver: (row) => row.cells[5].data
            }, userPermissions)
        }
    ];

    try {
        GridUtils.initStandardListGrid({
            gridId: 'person-grid',
            entityType: 'person',
            columns: columns,
            data: data,
            userPermissions: userPermissions,
            pagination: {
                enabled: true
            },
            sort: {
                multiColumn: true
            },
            features: {
                bulkOperations: true,
                inlineEditing: { mapping: { 1: 'first_name', 2: 'family_name', 3: 'email_address' } },
                advancedControls: true,
                realTimeSearch: true,
                dynamicFilters: true,
                dynamicPageSize: true,
                initialSort: [
                    { columnSelector: 'th:nth-child(3)' },
                    { columnSelector: 'th:nth-child(2)', shift: true }
                ]
            },
            idFieldIndex: 5
        });

} catch (error) {
        console.error('[PersonList] Error initializing grid:', error);
    }
    }) ();
</script>
