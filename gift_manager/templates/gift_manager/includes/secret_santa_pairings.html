{% load i18n %}
<div class="alert alert-warning secret-santa-pairings" role="status">
  <h2 class="h6">{% trans "Who gives to whom" %}</h2>
  <ul class="mb-0">
    {% for giver, recipient in pairings %}
    <li class="secret-santa-pairing">{% blocktrans %}{{ giver }} gives to {{ recipient }}{% endblocktrans %}</li>
    {% endfor %}
  </ul>
</div>
