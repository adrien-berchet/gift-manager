{% load i18n %}
<div class="alert alert-warning secret-santa-revealed-link" role="status">
  <p class="mb-2">
    {% blocktrans with name=revealed_participant.name %}Personal link of <strong>{{ name }}</strong>. Give it to them only: opening it shows who they drew.{% endblocktrans %}
  </p>
  <label class="visually-hidden" for="revealed-link-{{ revealed_participant.participant_id }}">{% trans "Personal link" %}</label>
  <input type="text" readonly class="form-control font-monospace" id="revealed-link-{{ revealed_participant.participant_id }}" value="{{ revealed_url }}">
</div>
