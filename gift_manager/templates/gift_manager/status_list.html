{% extends "gift_manager/base.html" %}

{% load i18n %}
{% load static %}

{% block title %}{{ translated_type }}{% endblock %}

{% block content %}
<h1 class="my-4">{{ translated_type }}</h1>

<!-- Grid.js container -->
<div id="status-grid" class="mt-3"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'gift_manager/grid-utils.js' %}"></script>
{% include "gift_manager/includes/grid-translations.html" %}
<script>
    {% load custom_filters %}
    (function () {
        // URL templates for links
        const statusDetailUrl = "{% url 'gift_manager:relation_status_detail' 1 %}".replace('1', '__ID__');

        // Prepare data for Grid.js
        const data = [
            {% for item in data %}
    [
        {% for col, name in column_names.items %}
    "{{ item|get_item:col|replace_none:''|escapejs }}"{% if not forloop.last %}, {% endif %}
    {% endfor %},
    { { item.pk } }
            ]{% if not forloop.last %}, {% endif %}
    {% endfor %}
        ];

    // Build columns dynamically
    const columns = [
        {% for col, name in column_names.items %}
    { name: '{{ name|escapejs }}' } {% if not forloop.last %}, {% endif %}
    {% endfor %},
    {
        name: '{% trans "Actions"|escapejs %}',
            sort: false,
                formatter: GridUtils.actionButtonsFormatter({
                    details: statusDetailUrl
                }, ['details'])
            }
        ];

    // Initialize Grid.js
    GridUtils.initGrid('status-grid', columns, data, {
        pagination: {
            enabled: true,
            limit: 10
        }
    });
    }) ();
</script>
{% endblock %}
