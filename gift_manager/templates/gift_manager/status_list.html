{% extends "gift_manager/base.html" %}

{% load i18n %}
{% load static %}

{% block title %}Gift Manager - {{ translated_type }}{% endblock %}

{% block content %}
<h1 class="my-4">{{ translated_type }}</h1>

<!-- Grid.js container -->
<div id="status-grid" class="mt-3"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'gift_manager/grid-utils.js' %}?v=4"></script>
{% include "gift_manager/includes/grid-translations.html" %}
<script>
    {% load custom_filters %}
    (function () {
        // Calculate column indices for clarity
        const numDataColumns = {{ column_names.items| length }};
        const statusPkIdx = numDataColumns;      // Index of status_pk
        const detailUrlIdx = numDataColumns + 1; // Index of detail URL

        // Prepare data for Grid.js
        const data = [
            {% for item in data %}
            [
                {% for col, name in column_names.items %}
                    "{{ item|get_item:col|replace_none:''|escapejs }}"{% if not forloop.last %}, {% endif %}
                {% endfor %},
                "{{ item.pk }}",  // cells[numDataColumns]
                "{% url 'gift_manager:relation_status_detail' item.pk %}"  // cells[numDataColumns + 1]
            ]{% if not forloop.last %}, {% endif %}
            {% endfor %}
        ];

        // Build columns dynamically
        const columns = [
            {% for col, name in column_names.items %}
            {
                name: '{{ name|escapejs }}',
                sort: false,
            } {% if not forloop.last %}, {% endif %}
            {% endfor %},
            { name: 'status_pk', hidden: true },
            { name: 'status_detail_url', hidden: true },
            {
                name: '{% trans "Actions"|escapejs %}',
                sort: false,
                formatter: GridUtils.actionButtonsFormatter({
                    details: (row) => row.cells[detailUrlIdx].data
                }, ['details'])
            }
        ];

        // Initialize Grid.js
        GridUtils.initGrid('status-grid', columns, data, {
            pagination: {
                enabled: true,
                limit: 10
            },
        });
    }) ();
</script>
{% endblock %}
