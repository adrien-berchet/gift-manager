{% extends "gift_manager/base.html" %}

{% load i18n %}
{% block title %}Gift Manager - {% trans "Login" %}{% endblock %}

{% block content %}
<h1 class="my-4">{% trans "Login" %}</h1>
<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Login</button>
</form>
<p class="mt-3">
    {% trans "Don't have an account?" %} <a href="{% url 'django_registration_register' %}">{% trans "Register here" %}</a>.
</p>
{% endblock %}
