[tool:pytest]
# Pytest configuration for Property-Based Testing

# Test discovery
testpaths = gift_manager/tests
python_files = test_property_based_suite.py test_*_property.py
python_classes = Test*Property* TestPropertyBasedSuite
python_functions = test_property_*

# Django settings
DJANGO_SETTINGS_MODULE = GiftManager.settings.testing
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --hypothesis-show-statistics
    --hypothesis-profile=pbt
    --reuse-db
    --nomigrations
    --disable-warnings

# Markers for property-based tests
markers =
    property_test: Property-based test using Hypothesis
    ui_property: UI-related property test
    crud_property: CRUD operation property test
    performance_property: Performance-related property test
    accessibility_property: Accessibility-related property test
    bulk_property: Bulk operations property test
    permission_property: Permission-based property test
    mobile_property: Mobile responsiveness property test
    keyboard_property: Keyboard accessibility property test
    slow: Slow running test
    integration: Integration test
    unit: Unit test

# Hypothesis configuration
hypothesis_profile_pbt_max_examples = 100
hypothesis_profile_pbt_deadline = 30000
hypothesis_profile_pbt_verbosity = normal

# Test output formatting
console_output_style = progress
junit_family = xunit2

# Coverage settings for property tests
coverage_report = term-missing
coverage_fail_under = 80

# Parallel execution settings
numprocesses = auto
dist = worksteal

# Timeout settings
timeout = 300
timeout_method = thread

# Django database settings for tests
database_engine = sqlite3
database_name = :memory:

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:django.*
    ignore::RuntimeWarning:hypothesis.*

# Property test specific settings
property_test_timeout = 60
property_test_max_failures = 5
property_test_report_format = json
