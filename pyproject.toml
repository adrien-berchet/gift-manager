[project]
name = "gift-manager"
authors = [{ name = "Adrien Berchet", email = "adrien.berchet@gmail.com" }]
description = "A Django application to manage gifts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache License 2.0" }
classifiers = ["Programming Language :: Python"]
dynamic = ["version"]
dependencies = [
    "django>=5.1,<6.0",
    "django-allauth>=0.61",
    "django-debug-toolbar>=4.2",
    "django-grappelli>=4.0",
    "django-modeltranslation>=0.18",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "whitenoise>=6.6",
    "gunicorn>=21.0",
    "werkzeug>=1.0.1",
    "uvicorn>=0.24",
]

[tool.setuptools]
include-package-data = true

[project.optional-dependencies]
docs = ["mkdocs>=1.5", "mkdocs-material>=9"]
test = [
    "mock>=5",
    "pytest>=8",
    "pytest-django>=4",
    "pytest-cov>=6",
    "pytest-html>=4",
    "factory-boy>=3.3",
    "faker>=24",
    "playwright>=1.39",
]

mypy = ["pytest-mypy>=0.10", "django-stubs>=4"]

dev = ["gift-manager[test,mypy]", "pre-commit>=3", "ipython>=8", "ruff>=0.3"]

production = ["sentry-sdk[django]>=1.40", "django-redis>=5"]

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["gift_manager*", "GiftManager*"]

[tool.pydocstyle]
# ignore the following:
#   - D107: Missing docstring in __init__
add-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
convention = "google"

[tool.isort]
profile = "black"
line_length = 100
force_single_line = true
skip_gitignore = true
skip = ["GiftManager/settings"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "GiftManager.settings.testing"
python_files = ["test_*.py"]
testpaths = ["gift_manager/tests"]
filterwarnings = []
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "frontend: marks tests as frontend/browser tests",
]
addopts = "-v"


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# select = ["E4", "E7", "E9", "F"]
select = ["ALL"]
ignore = [
    "ANN001",  # TODO: Fix and remove this one
    "ANN201",  # TODO: Fix and remove this one
    "ANN204",  # TODO: Fix and remove this one
    "ANN002",
    "ANN003",
    "BLE001",
    "B905",
    "COM812",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "DJ001",
    "ERA001",
    "EXE002",
    "FIX002",
    "ISC001",
    "N999",
    "PD002",
    "PD013",
    "PD015",
    "PLR2004",
    "RUF012",
    "TD002",
    "TD003",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = [
    "ANN202",
    "ANN206",
    "ARG001",
    "ARG002",
    "ARG003",
    "DTZ011",
    "PLC0415",
    "PLR2004",
    "S101",
    "S105",
    "S106",
    "SLF001",
    "S107",
    "T201",
]
"docs/*" = ["INP001"]
"manage.py" = ["PLC0415"]
"gift_manager/models.py" = ["ANN206", "ARG001", "FBT002", "PLC0415", "PLW2901"]
"GiftManager/settings/testing.py" = ["S105"]
"gift_manager/services.py" = ["RUF059"]
"gift_manager/templatetags/grid_tags.py" = [
    "ANN401",
    "ARG001",
    "FBT001",
    "FBT002",
    "PERF203",
    "S112",
    "S308",
    "SIM108",
    "SIM118",
]

[tool.ruff.lint.pylint]
max-args = 10
# max-branches = 12
# max-statements=50

[tool.ruff.lint.pycodestyle]
# E501 reports lines that exceed this length (lines may be longer than 100 in some cases,
# especially because of comments).
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]

[[tool.mypy.overrides]]
module = ["configobj.*", "construct.*"]
ignore_missing_imports = true

[tool.pylint.main]
# Ignore migrations (auto-generated) and conftest files
ignore-paths = ["gift_manager/migrations"]
