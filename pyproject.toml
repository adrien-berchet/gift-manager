[project]
name = "gift-manager"
authors = [{ name = "Adrien Berchet", email = "adrien.berchet@gmail.com" }]
description = "A Django application to manage gifts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache License 2.0" }
classifiers = ["Programming Language :: Python"]
dynamic = ["version"]
dependencies = [
    "click>=8.3.3",
    "cryptography>=46.0.7",
    "django-allauth>=65.14.1",
    "django-debug-toolbar>=4.2",
    "django-grappelli>=4.0",
    "django-modeltranslation>=0.18",
    "django-redis>=5",
    "django>=5.2.16,<6.0",
    "gunicorn>=21.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.2.2",
    "sentry-sdk[django]>=1.40",
    "urllib3>=2.7.0",
    "uvicorn>=0.24",
    "werkzeug>=3.1.6",
    "whitenoise>=6.6",
]

[tool.setuptools]
include-package-data = true

[project.optional-dependencies]
docs = ["mkdocs>=1.5", "mkdocs-material>=9"]
test = [
    "bandit>=1.8",
    "factory-boy>=3.3",
    "faker>=24",
    "hypothesis>=6.0",
    "mock>=5",
    "pip-audit>=2.9",
    "playwright>=1.39",
    "pytest-cov>=6",
    "pytest-django>=4",
    "pytest-html>=4",
    "pytest-playwright>=0.7",
    "pytest>=8",
    "tox-gh-actions>=3",
    "tox>=4",
]

mypy = ["pytest-mypy>=0.10", "django-stubs>=4"]

dev = ["gift-manager[test,mypy]", "pre-commit>=3", "ipython>=8", "ruff>=0.3"]

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["gift_manager*", "GiftManager*"]

[tool.pydocstyle]
# ignore the following:
#   - D107: Missing docstring in __init__
add-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
convention = "google"

[tool.isort]
profile = "black"
line_length = 100
force_single_line = true
skip_gitignore = true
skip = ["GiftManager/settings"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "GiftManager.settings.testing"
python_files = ["test_*.py"]
testpaths = ["gift_manager/tests"]
filterwarnings = []
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "frontend: marks tests as frontend/browser tests",
    "playwright: marks tests as playwright-specific tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "mobile: marks tests as mobile device tests",
    "performance: marks tests as performance benchmarks",
    "accessibility: marks tests as accessibility compliance tests",
]
addopts = "-v --strict-markers"


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# select = ["E4", "E7", "E9", "F"]
select = ["ALL"]
ignore = [
    "ANN001",  # TODO: Fix and remove this one
