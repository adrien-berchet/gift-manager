[project]
name = "gift-manager"
authors = [
    { name="Adrien Berchet", email="adrien.berchet@gmail.com" }
]
description = "A Django application to manage gifts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache License 2.0" }
classifiers = [
    "Programming Language :: Python",
]
dynamic = ["dependencies", "version"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
docs = [
]
test = [
    "mock>=5",
    "pytest>=8",
    "pytest-django>=4",
    "pytest-cov>=6",
    "pytest-html>=4",
]

mypy = [
    "pytest-mypy>=0.10",
]

[build-system]
requires = [
    "setuptools>=45",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["gift_manager*", "GiftManager*"]

[tool.pydocstyle]
# ignore the following:
#   - D107: Missing docstring in __init__
add-ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]
convention = "google"

[tool.isort]
profile = "black"
line_length = 100
force_single_line = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "GiftManager.settings"
python_files = ["test_*.py"]
filterwarnings = [
]

[tool.flake8]
# ignore the following:
#    E203: whitespace before ':'
#    W503: line break before binary operator
ignore = [
    "E203",
    "W503",
]
max-line-length = 120


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# select = ["E4", "E7", "E9", "F"]
select = ["ALL"]
ignore = [
    "ANN001",  # TODO: Fix and remove this one
    "ANN201",  # TODO: Fix and remove this one
    "ANN204",  # TODO: Fix and remove this one
    "ANN002",
    "ANN003",
    "ANN101",
    "ANN102",
    "BLE001",
    "B905",
    "COM812",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "DJ001",
    "ERA001",
    "EXE002",
    "FIX002",
    "ISC001",
    "N999",
    "PD002",
    "PD013",
    "PD015",
    "PLR2004",
    "RUF012",
    "TD002",
    "TD003",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = [
    "PLR2004",
    "S101",
]
"docs/*" = [
    "INP001",
]

[tool.ruff.lint.pylint]
max-args=10
# max-branches = 12
# max-statements=50

[tool.ruff.lint.pycodestyle]
# E501 reports lines that exceed this length (lines may be longer than 100 in some cases,
# especially because of comments).
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]

[[tool.mypy.overrides]]
module = [
    "configobj.*",
    "construct.*",
]
ignore_missing_imports = true
