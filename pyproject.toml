[tool.ruff.lint.pylint]
max-args = 10
# max-branches = 12
# max-statements=50

[tool.ruff.lint.pycodestyle]
# E501 reports lines that exceed this length (lines may be longer than 100 in some cases,
# especially because of comments).
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]

[[tool.mypy.overrides]]
module = ["configobj.*", "construct.*"]
ignore_missing_imports = true

[tool.pylint.main]
# Ignore migrations (auto-generated) and conftest files
ignore-paths = ["gift_manager/migrations"]
