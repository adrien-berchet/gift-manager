[base]
name = gift_manager
files = {[base]name} pyproject.toml

[tox]
envlist =
    lint
    py{310,311,312}

minversion = 4

[testenv]
extras = test
commands = pytest \
    --basetemp={envtmpdir} \
    --html reports/pytest-{envname}.html \
    --junit-xml=reports/pytest-{envname}.xml \
    --self-contained-html \
    {posargs}

[testenv:lint]
basepython = python3.10
deps =
    pre-commit
    pylint
commands =
    pre-commit run --all-files --show-diff-on-failure
    pylint -j {env:PYLINT_NPROCS:1} {[base]files}

[testenv:format]
basepython = python3.10
skip_install = true
deps =
    codespell
    pre-commit
commands =
    codespell -i 3 -x .codespellignorelines -w {[base]files}
    pre-commit run --all-files
