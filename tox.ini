[base]
name = gift_manager
files = {[base]name}

[tox]
envlist =
    lint
    py{310,311,312}

minversion = 4

[testenv]
extras = test
setenv =
    DJANGO_ENV = testing
    DJANGO_SETTINGS_MODULE = GiftManager.settings.testing
    HYPOTHESIS_PROFILE = gift_manager_pr
    DB_NAME={env:DB_NAME:gift_manager_test}
    DB_USER={env:DB_USER:gift_manager}
    DB_PASSWORD={env:DB_PASSWORD:gift_manager}
    DB_HOST={env:DB_HOST:localhost}
commands_pre =
commands = pytest \
    --basetemp={envtmpdir} \
    --cov={[base]name} \
    --cov-branch \
    --cov-fail-under=76 \
    --no-cov-on-fail \
    --cov-report term-missing \
    --cov-report html:reports/coverage-{envname} \
    --cov-report xml:reports/coverage-{envname}.xml \
    --html reports/pytest-{envname}.html \
    --junit-xml=reports/pytest-{envname}.xml \
    --self-contained-html \
    -m "not frontend and not playwright" \
    {posargs}

[testenv:py{310,311}]
commands = pytest \
    --basetemp={envtmpdir} \
    --html reports/pytest-{envname}.html \
    --junit-xml=reports/pytest-{envname}.xml \
    --self-contained-html \
    -m "not frontend and not playwright" \
    {posargs}

[testenv:py{310,311,312}-playwright]
extras = test
setenv =
    {[testenv]setenv}
    PLAYWRIGHT_BROWSERS_PATH={envtmpdir}/playwright-browsers
    DJANGO_ALLOW_ASYNC_UNSAFE=true
    E2E_FULL_MATRIX = {env:E2E_FULL_MATRIX:1}
commands_pre =
    playwright install chromium firefox webkit
    playwright install-deps
commands = pytest \
    --basetemp={envtmpdir} \
    --browser chromium \
    --browser firefox \
    --browser webkit \
    --html reports/playwright-{envname}.html \
    --junit-xml=reports/playwright-{envname}.xml \
    --self-contained-html \
    -m "frontend" \
    --maxfail=5 \
    --tb=short \
    --video=retain-on-failure \
    --screenshot=only-on-failure \
    {posargs}

[testenv:e2e]
# Convenient alias for running e2e tests with single browser
basepython = python3.11
extras = test
setenv =
    {[testenv]setenv}
    PLAYWRIGHT_BROWSERS_PATH={envtmpdir}/playwright-browsers
    DJANGO_ALLOW_ASYNC_UNSAFE=true
    E2E_FULL_MATRIX = {env:E2E_FULL_MATRIX:0}
commands_pre =
    playwright install chromium
    playwright install-deps
commands = pytest \
    --basetemp={envtmpdir} \
    --browser chromium \
    --html reports/e2e.html \
    --junit-xml=reports/e2e.xml \
    --self-contained-html \
    -m "{env:E2E_MARKER:frontend and not performance}" \
    --maxfail=5 \
    --tb=short \
    --video=retain-on-failure \
    --screenshot=only-on-failure \
    {posargs}

[testenv:e2e-debug]
# Debug mode for e2e tests (headed, verbose)
basepython = python3.11
extras = test
setenv =
    {[testenv]setenv}
    PLAYWRIGHT_BROWSERS_PATH={envtmpdir}/playwright-browsers
    DJANGO_ALLOW_ASYNC_UNSAFE=true
    E2E_FULL_MATRIX = {env:E2E_FULL_MATRIX:0}
    PLAYWRIGHT_DEBUG=1
commands_pre =
    playwright install chromium
    playwright install-deps
commands = pytest \
    --basetemp={envtmpdir} \
    --browser chromium \
    --headed \
    --html reports/e2e-debug.html \
    --junit-xml=reports/e2e-debug.xml \
    --self-contained-html \
    -m "frontend" \
    --maxfail=1 \
    -v -s \
    --tb=long \
    --video=on \
    --screenshot=on \
    {posargs}

[testenv:e2e-mobile]
# Mobile-specific e2e tests
basepython = python3.11
extras = test
setenv =
    {[testenv]setenv}
    PLAYWRIGHT_BROWSERS_PATH={envtmpdir}/playwright-browsers
    DJANGO_ALLOW_ASYNC_UNSAFE=true
    E2E_FULL_MATRIX = {env:E2E_FULL_MATRIX:0}
commands_pre =
    playwright install webkit
    playwright install-deps
commands = pytest \
    --basetemp={envtmpdir} \
    --browser webkit \
    --html reports/e2e-mobile.html \
    --junit-xml=reports/e2e-mobile.xml \
    --self-contained-html \
    -m "frontend and mobile" \
    --maxfail=5 \
    --tb=short \
    --video=retain-on-failure \
    --screenshot=only-on-failure \
    {posargs}

[testenv:property-comprehensive]
basepython = python3.11
extras = test
setenv =
    {[testenv]setenv}
    HYPOTHESIS_PROFILE = gift_manager_comprehensive
commands = pytest \
    --basetemp={envtmpdir} \
    --html reports/pytest-{envname}.html \
    --junit-xml=reports/pytest-{envname}.xml \
    --self-contained-html \
    -m "property_based and not frontend and not playwright" \
    --tb=short \
    {posargs}

[testenv:lint]
basepython = python3.10
deps =
    pre-commit
    pylint
commands_pre =
commands =
    pre-commit run --all-files --show-diff-on-failure
    pylint --errors-only -j {env:PYLINT_NPROCS:1} {[base]files}

[testenv:format]
basepython = python3.10
skip_install = true
deps =
    codespell
    pre-commit
commands_pre =
commands =
    codespell -i 3 -x .codespellignorelines -w {[base]files} pyproject.toml
    pre-commit run --all-files

[gh-actions]
python =
  3.10: py310, lint
  3.11: py311
  3.12: py312
